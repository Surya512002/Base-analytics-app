[profile.default]
src = "contracts"
test = "test"
out = "forge-out"
libs = ["lib/forge-std"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
    "forge-std/=lib/forge-std/src/",
    "contracts/=contracts/"
]

[rpc_endpoints]
base = "${BASE_RPC_URL:-https://mainnet.base.org}"
