# Gitleaks configuration for Base Analytics App
[extend]
useDefault = true

[allowlist]
description = "Allowlist test suites, mock configurations, contract registries, and standard test accounts"
paths = [
  '''test/.*''',
  '''e2e/.*''',
  '''\.env\.example''',
  '''scripts/.*''',
  '''lib/forge-std/.*''',
  '''lib/contracts/registry\.ts''',
  '''lib/contracts/contract-logic\.test\.ts''',
  '''lib/constants/contracts\.ts''',
  '''lib/constants/env\.ts''',
  '''Makefile''',
  '''package\.json''',
  '''package-lock\.json''',
]
regexes = [
  '''0x[a-fA-F0-9]{64}''',
  '''bc_[a-zA-Z0-9]+''',
  '''pred_keeper_[a-zA-Z0-9]+''',
  '''0x[a-fA-F0-9]{40}''',
]
