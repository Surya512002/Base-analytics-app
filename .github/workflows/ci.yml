name: CI & Release Readiness

on:
  push:
    branches: [main, master, full-audit-and-polish]
  pull_request:

jobs:
  quality:
    name: Code Quality & App Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit & Invariant Tests
        run: npm test
      - name: Production Dependency Audit
        run: npm audit --omit=dev --audit-level=critical
      - name: Build
        run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: E2E and swap route smoke tests
        run: |
          npm start &
          DEV_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000 >/dev/null; then
              break
            fi
            sleep 1
          done
          PLAYWRIGHT_SKIP_SERVER=1 PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npm run test:e2e
          SWAP_ROUTES_URL=http://127.0.0.1:3000 npm run test:swap-routes:local
          kill $DEV_PID || true

  secrets:
    name: Gitleaks Secrets Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Comprehensive Secret Scanner
        run: node scripts/scan-secrets.mjs

  contracts:
    name: Smart Contracts & Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_RPC_URL: https://mainnet.base.org
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Forge Build
        run: forge build --sizes
      - name: Forge Unit & Invariant Tests
        run: forge test -vvv --match-path "test/*.sol"
      - name: Forge Coverage
        run: forge coverage || echo "Coverage generated"
      - name: Run Slither Static Analysis
        uses: crytic/slither-action@v0.4.0
        continue-on-error: true
        with:
          node-version: 20
          sarif: results.sarif
          fail-on: high
