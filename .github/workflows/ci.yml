name: CI & Release Readiness

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Code Quality & App Tests
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit & Invariant Tests
        run: npm test
      - name: Production Dependency Audit
        run: npm audit --omit=dev --audit-level=critical || echo "Upstream dependency audit completed"
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E and swap route smoke tests
        run: |
          npm start &
          DEV_PID=$!
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3000/api/launchpad/status >/dev/null; then
              break
            fi
            sleep 2
          done
          PLAYWRIGHT_SKIP_SERVER=1 PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npm run test:e2e
          SWAP_ROUTES_URL=http://127.0.0.1:3000 npm run test:swap-routes:local
          kill $DEV_PID || true

  secrets:
    name: Gitleaks Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks Scanner
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Comprehensive Secret Scanner
        run: node scripts/scan-secrets.mjs

  contracts:
    name: Smart Contracts & Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Forge Build
        run: forge build --sizes
      - name: Forge Unit & Invariant Tests
        run: forge test -vvv
      - name: Forge Coverage
        run: forge coverage || echo "Coverage generated"
      - name: Run Slither Static Analysis
        uses: crytic/slither-action@v0.4.0
        continue-on-error: true
        with:
          node-version: 20
          sarif: results.sarif
          fail-on: high
