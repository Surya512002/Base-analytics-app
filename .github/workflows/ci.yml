name: CI & Release Readiness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repo. (Gitleaks gets what it needs via GITHUB_TOKEN.)
permissions:
  contents: read

# A newer push to the same branch / PR cancels the older run: faster feedback, fewer minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (a tag can be moved; a SHA can't). The comment is the
# release it points to; Dependabot keeps both up to date (.github/dependabot.yml).
jobs:
  quality:
    name: Code Quality & App Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: collector/go.mod
          cache: false
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit & Invariant Tests
        run: npm test
      - name: Production Dependency Audit
        run: npm audit --omit=dev --audit-level=critical
      - name: Build
        run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E and swap route smoke tests
        run: |
          npm start &
          APP_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000 >/dev/null; then
              break
            fi
            sleep 1
          done
          PLAYWRIGHT_SKIP_SERVER=1 PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npm run test:e2e
          SWAP_ROUTES_URL=http://127.0.0.1:3000 npm run test:swap-routes:local || true
          kill $APP_PID || true
      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  secrets:
    name: Gitleaks Secrets Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Gitleaks Scanner
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Comprehensive Secret Scanner
        run: node scripts/scan-secrets.mjs

  contracts:
    name: Smart Contracts & Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_RPC_URL: https://mainnet.base.org
      UNDEFINED_RPC_URL_PLACEHOLDER: https://mainnet.base.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: stable
      - name: Forge Build
        run: forge build --sizes
      - name: Forge Unit & Invariant Tests
        run: forge test -vvv --match-path "test/*.sol"
      - name: Forge Coverage
        run: forge coverage || echo "Coverage generated"
      - name: Run Slither Static Analysis
        uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        continue-on-error: true
        with:
          node-version: 24
          sarif: results.sarif
          fail-on: high
